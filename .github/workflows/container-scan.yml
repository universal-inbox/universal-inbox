name: Container image scan

# CI never builds the production image (Koyeb builds it from the Dockerfile on
# deploy). This workflow builds the `runtime` stage and scans it with Trivy to
# catch vulnerable OS packages and bundled binaries that cargo-deny cannot see.
# The full build is slow, so it only runs weekly, on demand, and when the image
# definition changes.

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - devbox.json
      - devbox.lock
      - .github/workflows/container-scan.yml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - devbox.json
      - devbox.lock
      - .github/workflows/container-scan.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Build and scan API image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      IMAGE: universal-inbox:scan
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          push: false
          provenance: false
          tags: ${{ env.IMAGE }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Upload scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # Fork PRs get a read-only token and cannot upload SARIF.
        if: always() && hashFiles('trivy-results.sarif') != '' && github.event.pull_request.head.repo.fork != true
        with:
          sarif_file: trivy-results.sarif
          category: container-image
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          format: table
          exit-code: "1"
          skip-setup-trivy: true
