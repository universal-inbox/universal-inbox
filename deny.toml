# cargo-deny configuration, run on every PR (`just check-deny`).
# Keep advisory ignores in sync with `.cargo/audit.toml` (daily cargo-audit cron).
# Always run with `--workspace`: the root manifest is also a package, so without it
# cargo-deny only checks the domain crate and skips the api/ and web/ dependencies.

[graph]
all-features = false

[advisories]
version = 2
# Unmaintained crates only fail the check when they are direct dependencies.
unmaintained = "workspace"
yanked = "warn"
ignore = [
  # rsa: Marvin timing side channel on private-key decryption. No fixed release yet.
  # rsa is only used by openidconnect to verify ID token signatures with public keys.
  { id = "RUSTSEC-2023-0071", reason = "rsa only verifies signatures with public keys; no fixed release" },
  # crypto-bigint 0.5: timing variability in constant-time operations. Fixed only in 0.7.6;
  # pulled by p256/p384 via openidconnect 4.0.1 (latest), which only verifies ID token
  # signatures with public keys, so no secret-dependent operation is exposed.
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only verifies signatures with public keys via openidconnect; no fixed 0.5 release" },
  { id = "RUSTSEC-2026-0594", reason = "cookie 0.16 is pinned by actix-web 4.19 (no fixed 0.16 release); only affects processes that fork() before adding private cookies and this server never forks" },
  { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained, no replacement upgrade available" },
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no replacement upgrade available; used across the whole workspace" },
  { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, follows chrono; no replacement upgrade available" },
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. No GPL, LGPL, AGPL, SSPL or BUSL: a crate offering one of
# these alongside a permissive option (e.g. r-efi) is accepted through that option.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  # Boost license (ryu, xxhash-rust)
  "BSL-1.0",
  # Public domain dedication (base16, dunce)
  "CC0-1.0",
  # Mozilla CA certificate data (webpki-roots, webpki-root-certs)
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  # File-level copyleft, fine for unmodified use (webauthn-rs, cssparser, selectors)
  "MPL-2.0",
  # Unicode data tables (icu_*, unicode-ident, finl_unicode)
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

# ical 0.11.0 ships its Apache-2.0 text as license-file without a license field.
[[licenses.clarify]]
crate = "ical"
expression = "Apache-2.0"
license-files = [{ path = "LICENSE", hash = 0x5115d0f9 }]
