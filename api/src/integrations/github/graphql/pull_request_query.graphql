query PullRequestQuery($owner: String!, $repository: String!, $pr_number: Int!) {
  repository(owner: $owner, name: $repository) {
    pullRequest(number: $pr_number) {
      id
      number
      url
      titleHTML
      bodyHTML
      labels(first: 10) {
        nodes {
          color
          description
          name
        }
      }
      comments(first: 100) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...IssueCommentFields
        }
      }
      reviewThreads(first: 50) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ReviewThreadFields
        }
      }
      commits(last: 1) {
        nodes {
          commit {
            oid
            checkSuites(first: 10) {
              nodes {
                conclusion
                status
                checkRuns(first: 10) {
                  nodes {
                    conclusion
                    name
                    status
                    detailsUrl
                  }
                }
                workflowRun {
                  workflow {
                    name
                    url
                  }
                }
                app {
                  name
                  logoUrl
                  url
                }
              }
            }
          }
        }
        totalCount
      }

      baseRefName
      baseRepository {
        nameWithOwner
        url
      }
      headRefName
      headRepository {
        nameWithOwner
        url
      }
      author {
        __typename
        avatarUrl
        login
        ... on User {
          name
        }
      }
      assignees(first: 20) {
        nodes {
          avatarUrl
          login
          name
        }
      }

      reviewDecision
      reviews(first: 50) {
        nodes {
          id
          url
          submittedAt
          author {
            __typename
            avatarUrl
            login
            ... on User {
              name
            }
          }
          bodyHTML
          state
        }
      }

      reviewRequests(first: 20) {
        nodes {
          requestedReviewer {
            __typename
            ... on User {
              userAvatarUrl: avatarUrl
              userLogin: login
              userName: name
            }
            ... on Bot {
              botLogin: login
              botAvatarUrl: avatarUrl

            }
            ... on Mannequin {
              mannequinLogin: login
              mannequinAvatarUrl: avatarUrl

            }
            ... on Team {
              teamAvatarUrl: avatarUrl
              teamName: name
            }
          }
        }
      }

      state
      isDraft

      closedAt
      createdAt
      updatedAt

      mergeable
      mergedAt
      mergeStateStatus
      mergedBy {
        __typename
        login
        avatarUrl
        ... on User {
          name
        }
      }

      deletions
      additions
      changedFiles
    }
  }
}

query PullRequestCommentsQuery(
  $owner: String!
  $repository: String!
  $pr_number: Int!
  $after: String
) {
  repository(owner: $owner, name: $repository) {
    pullRequest(number: $pr_number) {
      comments(first: 100, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...IssueCommentFields
        }
      }
    }
  }
}

query PullRequestReviewThreadsQuery(
  $owner: String!
  $repository: String!
  $pr_number: Int!
  $after: String
) {
  repository(owner: $owner, name: $repository) {
    pullRequest(number: $pr_number) {
      reviewThreads(first: 50, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ReviewThreadFields
        }
      }
    }
  }
}

query PullRequestReviewThreadCommentsQuery($thread_id: ID!, $after: String) {
  node(id: $thread_id) {
    __typename
    ... on PullRequestReviewThread {
      comments(first: 100, after: $after) {
        pageInfo {
          hasNextPage
          endCursor
        }
        nodes {
          ...ReviewCommentFields
        }
      }
    }
  }
}

fragment IssueCommentFields on IssueComment {
  id
  bodyHTML
  createdAt
  url
  isMinimized
  author {
    __typename
    avatarUrl
    login
    ... on User {
      name
    }
  }
}

fragment ReviewThreadFields on PullRequestReviewThread {
  id
  path
  line
  originalLine
  startLine
  originalStartLine
  isResolved
  isOutdated
  comments(first: 50) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      ...ReviewCommentFields
    }
  }
}

fragment ReviewCommentFields on PullRequestReviewComment {
  id
  bodyHTML
  createdAt
  url
  diffHunk
  isMinimized
  author {
    __typename
    avatarUrl
    login
    ... on User {
      name
    }
  }
}
