[application]
environment = "default"
listen_address = "0.0.0.0"
listen_port = 8000
# api_path must end with /
api_path = "/api/"
front_base_url = "http://localhost:8080"
# If `static_path` is specified, statics from `static_dir` will be served on `static_path`
# static_path = ""
min_sync_notifications_interval_in_minutes = 5
min_sync_tasks_interval_in_minutes = 5
# Exponential backoff for sync failures: delay = min(base * 2^(failures-1), max)
sync_backoff_base_delay_in_seconds = 120
sync_backoff_max_delay_in_seconds = 3600
# After this many hours of continuous failures, mark the integration as Failing
sync_failure_window_in_hours = 48
# Disabled by default
# support_href = "mailto:support@universal-inbox.com"
show_changelog = false
dry_run = false

[application.cron.refresh_oauth_tokens]
is_enabled = false
# Cron expression with a seconds field
schedule = "0 */5 * * * *"
minutes_before_expiry = 10
lock_ttl_seconds = 60

# Purge completed jobs from the Redis job queue. Enabled by default: apalis-redis
# never frees the `data` hash entry of a completed job, so without this cron the
# queue grows until Redis hits its `maxmemory` cap and stops accepting writes.
[application.cron.vacuum_jobs]
is_enabled = true
# Cron expression with a seconds field
schedule = "0 */10 * * * *"
# Completed jobs younger than this are kept, so recent results stay inspectable
retention_hours = 6
batch_size = 1000
max_batches_per_tick = 200
lock_ttl_seconds = 300

# Retry the OAuth grant revocations that failed on disconnect or account
# deletion. Enabled by default: otherwise such a grant stays valid at its
# provider forever (for Slack, its events keep coming).
[application.cron.retry_oauth_grant_revocations]
is_enabled = true
# Cron expression with a seconds field
schedule = "0 */5 * * * *"
batch_size = 100
# Exponential backoff: 5 minutes, doubled after each failure, capped at 1 day
base_delay_in_seconds = 300
max_delay_in_seconds = 86400
max_attempts = 20
lock_ttl_seconds = 60

# Revoke the grant and pause the connection of every OAuth provider connection
# of users who have not used Universal Inbox for `inactivity_threshold_days`,
# and of those failing for `failing_threshold_days`, so they do not keep
# credentials they no longer use (Slack also stops sending their events).
# Reconnecting the integration resumes it. Inactive users are warned by email
# `inactivity_warning_days` before their connections are paused (0 disables
# the warning), and users are emailed once their connections are paused, one
# email per user listing all their connections.
# Before enabling it on an instance with existing users, run
# `integration-connection pause-without-email --inactive-before <date>` once:
# it pauses, without any email, the connections of users inactive since then
# and the already long failing ones, so the cron only emails about the users
# who become inactive, and the connections that start failing, afterwards.
[application.cron.pause_integration_connections]
is_enabled = false
# Cron expression with a seconds field
schedule = "0 0 3 * * *"
inactivity_threshold_days = 90
inactivity_warning_days = 7
failing_threshold_days = 30
lock_ttl_seconds = 300

# Optional: without an [application.email] section, no email is sent (see
# api/config/dev.toml for an example). Once any email setting is set, all of
# them are required except `smtp_port` (defaults to 465).

[application.security]
csp_extra_connect_src = []
# Reverse proxies in front of the API that append the client address to
# X-Forwarded-For (one TLS-terminating proxy or ingress is the common case).
# Per-IP rate limits use the client IP found that many entries from the right
# of X-Forwarded-For; entries further left are client-supplied and ignored.
# Set to 0 when the API is exposed directly: forwarding headers are then
# ignored and the TCP peer address is used. `Forwarded` is never trusted.
# Not sure how many proxies there are? Send a request without an
# X-Forwarded-For header and look at its HTTP root span: the value to set is
# `http.x_forwarded_for.entries`, and `http.x_forwarded_for.masked` lists the
# chain with public (client) addresses masked. A chain shorter than this
# setting is refused and logged as a warning.
trusted_proxy_hops = 1
# Origins trusted as MCP clients. This single allow-list is checked in three
# places:
#   1. path-restricted CORS for `/api/mcp`, `/api/oauth2`, `/.well-known/oauth-*`
#   2. the MCP server's `Origin` header guard (RFC 6454)
#   3. unauthenticated OAuth2 dynamic client registration: a redirect_uri
#      whose origin is in this list is accepted even though it's not loopback
# Defaults cover the major hosted MCP clients (Anthropic, OpenAI, Google,
# Mistral); operators tighten via local.toml / env if they want a narrower
# trust scope.
mcp_extra_allowed_origins = [
    "https://claude.ai",
    "https://claude.com",
    "https://chatgpt.com",
    "https://chat.openai.com",
    "https://platform.openai.com",
    "https://gemini.google.com",
    "https://chat.mistral.ai",
    "https://callback.mistral.ai",
]
# How long an email-verification link stays valid (older links are rejected and
# the user must request a new verification email).
email_verification_token_validity_in_hours = 24
# `Host` header values accepted by the MCP endpoint (DNS-rebinding protection,
# enforced by rmcp). The host of `front_base_url` and loopback hosts are always
# accepted; list here any other public hostname the API is reached under
# (entries without a port match any port). Other hosts get 403.
# mcp_extra_allowed_hosts = ["universal-inbox.com"]
# Optional: block registration/authentication from specific email domains with custom messages
# email_domain_blacklist = { "blocked-domain.com" = "Registration is not allowed from this domain", "example.org" = "Please use your company email address" }

# [[application.security.authentication]]
# type = "OpenIDConnect"
# oidc_issuer_url = "https://oidc.provider"
# oidc_api_client_id = "5678@universal_inbox"
# oidc_api_client_secret = "secret"
# user_profile_url = "https://oidc.provider/user"
# oidc_flow_settings.type = "AuthorizationCodePKCEFlow"
# oidc_flow_settings.introspection_url = ""
# oidc_flow_settings.front_client_id = "1234@universal_inbox"
#
# OR
#
# [[application.security.authentication]]
# type = "OpenIDConnect"
# oidc_issuer_url = "https://oidc.provider"
# oidc_api_client_id = "5678@universal_inbox"
# oidc_api_client_secret = "secret"
# user_profile_url = "https://oidc.provider/user"
# oidc_flow_settings.type = "OIDCGoogleAuthorizationCodeFlow"
#
# OR
#
[[application.security.authentication]]
type = "Local"
# See OWASP recommendations https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
argon2_algorithm = "argon2id"
argon2_version = 19
argon2_memory_size = 20000
argon2_iterations = 2
argon2_parallelism = 1
# Per-account login-attempt throttling (in addition to the per-IP rate limit).
# After `max_login_attempts` consecutive failures for a given email, the account
# is temporarily locked for `login_lockout_base_seconds`, doubling on each further
# failure up to `login_lockout_max_seconds`. The failed-attempt counter decays
# over `login_attempt_window_seconds`. A successful login resets the counter.
max_login_attempts = 5
login_attempt_window_seconds = 3600
login_lockout_base_seconds = 300
login_lockout_max_seconds = 3600
# Per-account request budgets (in addition to the per-IP rate limit), counted per
# email whatever the client IP and whether or not the account exists: login
# requests over `login_request_window_seconds`, and registration + password-reset
# requests (which send emails) over `account_email_window_seconds`.
max_login_requests_per_account = 20
login_request_window_seconds = 60
max_account_emails_per_address = 5
account_email_window_seconds = 3600
#
# OR
#
# [[application.security.authentication]]
# type = "Passkey"

[application.http_session]
# secret_key = ""
# Generate new JWT key pair using `just generate-jwt-key-pair`
jwt_secret_key = ""
jwt_public_key = ""
jwt_token_expiration_in_days = 30
max_age_days = 30

[application.observability.logging]
# See https://docs.rs/tracing-subscriber/latest/tracing_subscriber/struct.EnvFilter.html
# A few targets are forced off in code whatever is set here — see
# FORCED_OFF_TARGETS in api/src/observability.rs: they record request bodies
# carrying customer PII as span attributes.
log_directive = "info"
dependencies_log_level = "error"
# "Pretty" (multi-line, colored) or "Json" (one object per line, for log collectors)
format = "Pretty"

# [application.observability.tracing]
# otlp_exporter_protocol = "Grpc" # or Http
# otlp_exporter_endpoint = "https://otlp.host"
# is_stdout_logging_enabled = true
# Each OTLP signal has its own filter, independent from `log_directive`
# (stdout only) and from RUST_LOG. Same EnvFilter syntax.
# Spans, and events recorded as span events:
# otel_trace_directive = "info"
# Events exported as OTLP logs. An event passing both filters is exported
# twice, so keep this one tighter:
# otel_log_directive = "warn"
# The access log and the apalis task.start/task.done lines are kept at warn on
# both (OTEL_QUIET_DIRECTIVES in api/src/observability.rs) unless named here.

# Depending on the OTLP provider, the header may be different or may not be
# required
# [application.observability.tracing.otlp_exporter_headers]
# api-key = "12345"

# [application.chat_support]
# website_id = "CRISP_WEBSITE_ID"
# identity_verification_secret_key = "CRISP_SECRET_KEY"

# Optional Stripe billing. When this block is absent, no billing code runs and
# every user has unlimited access (self-hosted default). When present, Free vs
# Paid plan enforcement is active on this instance.
#
# [application.billing]
# stripe_secret_key = "sk_test_..."
# stripe_publishable_key = "pk_test_..."
# stripe_webhook_signing_secret = "whsec_..."
# stripe_price_id = "price_..."
#
# [application.billing.free_plan]
# max_integration_connections = 2          # default 2
# notification_sync_interval_in_minutes = 1440  # default 1440 (once a day)
# task_sync_interval_in_minutes = 1440          # default 1440 (once a day)
# rollout_grace_days = 30                       # default 30

# Redis-backed MCP session store. Persists each session's `initialize`
# parameters so a follow-up request landing on a different pod can transparently
# restore the session. Always enabled; only the TTL is configurable.
[application.mcp_session_store]
ttl_seconds = 86400

[database]
host = "127.0.0.1"
port = 5432
username = "postgres"
password = "password"
database_name = "universal-inbox"
use_tls = false
max_connections = 10
# Max time to wait for a row/table lock before failing fast (SQLSTATE 55P03) instead of
# hanging behind another transaction.
lock_timeout_in_milliseconds = 3000
# Max time a single statement may run before Postgres cancels it (SQLSTATE 57014).
statement_timeout_in_milliseconds = 60000
# Max time to wait for a connection from the pool before failing fast.
acquire_timeout_in_seconds = 5

[redis]
host = "127.0.0.1"
port = 6379
use_tls = false

# tag: New notification integration
[integrations.github]
name = "Github"
kind = "Github"
page_size = 50
required_oauth_scopes = ["notifications", "read:discussion", "read:org", "repo"]
# OAuth client credentials from https://github.com/settings/developers
oauth_client_id = ""
oauth_client_secret = ""
# Rate limiting configuration
api_max_retry_duration_http_seconds = 30
api_max_retry_duration_worker_seconds = 600

[integrations.linear]
name = "Linear"
kind = "Linear"
# OAuth client credentials from https://linear.app/settings/api/applications
oauth_client_id = ""
oauth_client_secret = ""
required_oauth_scopes = ["read", "write"]
# Rate limiting configuration
api_max_retry_duration_http_seconds = 30
api_max_retry_duration_worker_seconds = 600

[integrations.google_mail]
name = "Google Mail"
kind = "GoogleMail"
page_size = 500
required_oauth_scopes = ["https://www.googleapis.com/auth/gmail.modify"]
# OAuth client credentials from https://console.cloud.google.com/apis/credentials
oauth_client_id = ""
oauth_client_secret = ""
warning_message = "Google Mail integration is not yet public, it requires your email address to be whitelisted and you will see a warning message from Google while connecting. If you still want to connect it, please send the Google email address you want to use to the [support](mailto:support@universal-inbox.com)."
# Rate limiting configuration
api_max_retry_duration_http_seconds = 30
api_max_retry_duration_worker_seconds = 600

[integrations.google_calendar]
name = "Google Calendar"
kind = "GoogleCalendar"
required_oauth_scopes = ["https://www.googleapis.com/auth/calendar"]
# OAuth client credentials from https://console.cloud.google.com/apis/credentials
oauth_client_id = ""
oauth_client_secret = ""
# Rate limiting configuration
api_max_retry_duration_http_seconds = 30
api_max_retry_duration_worker_seconds = 600

[integrations.google_drive]
name = "Google Drive"
kind = "GoogleDrive"
page_size = 100
required_oauth_scopes = ["https://www.googleapis.com/auth/drive.readonly", "https://www.googleapis.com/auth/drive.metadata.readonly"]
# OAuth client credentials from https://console.cloud.google.com/apis/credentials
oauth_client_id = ""
oauth_client_secret = ""
warning_message = "Google Drive integration is not yet public, it requires your email address to be whitelisted and you will see a warning message from Google while connecting. If you still want to connect it, please send the Google email address you want to use to the [support](mailto:support@universal-inbox.com)."
# Rate limiting configuration
api_max_retry_duration_http_seconds = 30
api_max_retry_duration_worker_seconds = 600

[integrations.todoist]
name = "Todoist"
kind = "Todoist"
required_oauth_scopes = ["data:read_write", "data:delete"]
# OAuth client credentials from https://app.todoist.com/app/settings/integrations/app-management
oauth_client_id = ""
oauth_client_secret = ""
# Rate limiting configuration
api_max_retry_duration_http_seconds = 30
api_max_retry_duration_worker_seconds = 600

[integrations.slack]
name = "Slack"
kind = "Slack"
required_oauth_scopes = [
  "channels:history",
  "channels:read",
  "emoji:read",
  "groups:history",
  "groups:read",
  "im:history",
  "im:read",
  "mpim:history",
  "mpim:read",
  "reactions:read",
  "reactions:write",
  "team:read",
  "usergroups:read",
  "users:read",
]
use_as_oauth_user_scopes = true
# OAuth client credentials from https://api.slack.com/apps
oauth_client_id = ""
oauth_client_secret = ""
# Signing secret used to verify inbound Slack event webhooks.
# Find it at https://api.slack.com/apps → Basic Information → Signing Secret.
# In production, set via env: UNIVERSAL_INBOX__INTEGRATIONS__SLACK__SIGNING_SECRET=…
signing_secret = ""

[integrations.ticktick]
name = "Tick Tick"
kind = "TickTick"
# OAuth client credentials from https://developer.ticktick.com
oauth_client_id = ""
oauth_client_secret = ""
required_oauth_scopes = ["tasks:read", "tasks:write"]
is_enabled = true

[oauth2]
# Generate with: openssl rand -hex 32
token_encryption_key = "to be generated"

