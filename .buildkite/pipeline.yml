# Buildkite port of .github/workflows/ci-pr.yml and ci-main.yml.
# Every step runs the same `just` recipes as GitHub Actions, inside devbox
# (see scripts/devbox-run.sh). Steps guarded by `build.branch == pipeline.default_branch`
# replace their PR counterpart with the coverage variant on main.

env:
  RUST_MIN_STACK: "104857600"
  CARGO_TERM_COLOR: "always"

# Shared by every step: hosted Linux agent plus a cache volume holding the Nix store,
# the Rust toolchain, cargo registry and build artifacts (replaces devbox's
# `enable-cache` and Swatinem/rust-cache).
x-devbox-step: &devbox-step
  agents:
    queue: "linux-large"
  cache:
    name: "devbox-rust"
    size: "100g"
    paths:
      - "/nix"
      - "/root/.cache"
      - "/root/.cargo"
      - "/root/.rustup"
      - "target"

steps:
  - label: ":docker: Dockerfile lint"
    key: "lint-dockerfile"
    <<: *devbox-step
    command: ".buildkite/scripts/devbox-run.sh just lint-dockerfile"

  - label: ":lock: Dependency audit"
    key: "supply-chain"
    <<: *devbox-step
    command: ".buildkite/scripts/devbox-run.sh cargo deny --workspace --all-features check advisories sources bans licenses"

  - label: ":rust: Rustfmt"
    key: "rustfmt"
    <<: *devbox-step
    command: ".buildkite/scripts/devbox-run.sh just check-format"

  - label: ":rust: Check unused Rust dependencies"
    key: "unused-deps"
    <<: *devbox-step
    command: ".buildkite/scripts/devbox-run.sh just check-unused-dependencies"

  - label: ":rust: Build"
    key: "build"
    <<: *devbox-step
    env:
      # Clippy never launches a browser; skip the ~90 MB driver assembly.
      PLAYWRIGHT_SKIP_DRIVER_DOWNLOAD: "1"
    command: ".buildkite/scripts/devbox-run.sh just check-all"

  - label: ":test_tube: Test shared package"
    key: "test-ui"
    if: "build.branch != pipeline.default_branch"
    depends_on: "build"
    <<: *devbox-step
    env:
      CI_JUNIT: "target/nextest/ci/junit.xml"
    command: ".buildkite/scripts/devbox-run.sh just test-ci"
    artifact_paths: "junit-*.xml"

  - label: ":test_tube: Test shared package with coverage"
    key: "test-ui-coverage"
    if: "build.branch == pipeline.default_branch"
    depends_on: "build"
    <<: *devbox-step
    env:
      CI_JUNIT: "target/nextest/ci/junit.xml"
    command: ".buildkite/scripts/devbox-run.sh just test-coverage"
    artifact_paths:
      - "junit-*.xml"
      - "lcov.info"

  - label: ":globe_with_meridians: Test web frontend"
    key: "test-ui-web"
    depends_on: "build"
    <<: *devbox-step
    command: ".buildkite/scripts/devbox-run.sh just web/test-ci"

  - label: ":electric_plug: Test API"
    key: "test-ui-api"
    if: "build.branch != pipeline.default_branch"
    depends_on: "build"
    <<: *devbox-step
    env:
      CI_SERVICES: "1"
      CI_JUNIT: "target/nextest/ci/junit.xml"
      RUST_BACKTRACE: "full"
    command: ".buildkite/scripts/devbox-run.sh just api test-ci"
    artifact_paths: "junit-*.xml"

  - label: ":electric_plug: Test API with coverage"
    key: "test-ui-api-coverage"
    if: "build.branch == pipeline.default_branch"
    depends_on: "build"
    <<: *devbox-step
    env:
      CI_SERVICES: "1"
      CI_BROWSER_DEPS: "1"
      CI_JUNIT: "target/nextest/ci/junit.xml"
      RUST_BACKTRACE: "full"
      # Nix's ldd can't see system libs installed by `install-deps`, causing
      # Playwright's host validation to falsely report missing libraries.
      # The system dynamic linker (used by the Chromium binary) finds them fine.
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
    command: ".buildkite/scripts/devbox-run.sh bash -c 'just web build-ci && just api/test-coverage'"
    artifact_paths:
      - "junit-*.xml"
      - "api/lcov.info"

  - label: ":performing_arts: Browser tests"
    key: "test-browser"
    if: "build.branch != pipeline.default_branch"
    depends_on: "build"
    <<: *devbox-step
    env:
      CI_SERVICES: "1"
      CI_BROWSER_DEPS: "1"
      CI_JUNIT: "target/nextest/ci-browser/junit.xml"
      RUST_BACKTRACE: "full"
      # See "Test API with coverage".
      PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: "1"
    command: ".buildkite/scripts/devbox-run.sh bash -c 'just api install-tools && just web build-ci && just api test-ci-browser'"
    artifact_paths: "junit-*.xml"

  # Runs even when tests fail (replaces dorny/test-reporter).
  - wait: ~
    continue_on_failure: true

  - label: ":junit: Test report"
    # No report exists when the tests never ran; the failed test steps already fail the build.
    soft_fail: true
    agents:
      queue: "linux-small"
    plugins:
      - junit-annotate#v2.7.0:
          artifacts: "junit-*.xml"
