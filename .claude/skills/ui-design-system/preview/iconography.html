<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css?v=20260423">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-ui); color: #0F172A; }
  .wrap { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #64748B; margin-bottom: 4px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .ic { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; }
  .ic iconify-icon { font-size: 20px; color: #0F172A; }
  .ic .n { font-family: var(--font-mono); font-size: 9.5px; color: #64748B; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="label">Lucide — UI icons (stroke 2, rounded)</div>
    <div class="row">
      <div class="ic"><iconify-icon icon="lucide:inbox"></iconify-icon><span class="n">inbox</span></div>
      <div class="ic"><iconify-icon icon="lucide:clock"></iconify-icon><span class="n">clock</span></div>
      <div class="ic"><iconify-icon icon="lucide:check"></iconify-icon><span class="n">check</span></div>
      <div class="ic"><iconify-icon icon="lucide:square-check"></iconify-icon><span class="n">square-check</span></div>
      <div class="ic"><iconify-icon icon="lucide:settings"></iconify-icon><span class="n">settings</span></div>
      <div class="ic"><iconify-icon icon="lucide:trash-2"></iconify-icon><span class="n">trash-2</span></div>
      <div class="ic"><iconify-icon icon="lucide:search"></iconify-icon><span class="n">search</span></div>
      <div class="ic"><iconify-icon icon="lucide:external-link"></iconify-icon><span class="n">external</span></div>
      <div class="ic"><iconify-icon icon="lucide:more-horizontal"></iconify-icon><span class="n">more</span></div>
      <div class="ic"><iconify-icon icon="lucide:chevron-down"></iconify-icon><span class="n">chevron</span></div>
    </div>
  </div>
  <div>
    <div class="label">Simple-icons — integration brands</div>
    <div class="row">
      <div class="ic"><div class="brand-icon"><iconify-icon icon="logos:github-icon"></iconify-icon></div><span class="n">github</span></div>
      <div class="ic"><div class="brand-icon"><iconify-icon icon="logos:linear-icon"></iconify-icon></div><span class="n">linear</span></div>
      <div class="ic"><div class="brand-icon"><iconify-icon icon="logos:slack-icon"></iconify-icon></div><span class="n">slack</span></div>
      <div class="ic"><div class="brand-icon"><iconify-icon icon="logos:google-gmail"></iconify-icon></div><span class="n">gmail</span></div>
      <div class="ic"><div class="brand-icon"><iconify-icon icon="logos:google-calendar"></iconify-icon></div><span class="n">gcal</span></div>
      <div class="ic"><div class="brand-icon"><iconify-icon icon="logos:todoist-icon"></iconify-icon></div><span class="n">todoist</span></div>
      <div class="ic"><div class="brand-icon"><iconify-icon icon="logos:notion-icon"></iconify-icon></div><span class="n">notion</span></div>
    </div>
  </div>
</div>
</body>
</html>
