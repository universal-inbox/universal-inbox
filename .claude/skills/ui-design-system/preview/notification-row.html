<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notification row</title>
<link rel="stylesheet" href="../colors_and_type.css?v=20260423">
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-ui); color: var(--ui-base-content); font-size: 12.5px; }
  .wrap { padding: 0; }
  .item { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 1px solid #F1F5F9; position: relative; }
  .item.unread { background: #F1F8FF; }
  .item.selected { background: #E0EDFF; box-shadow: inset 3px 0 0 #388FEF; }
  .icn { width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #E2E8F0; flex-shrink: 0; }
  .icn iconify-icon { font-size: 15px; }
  .icn iconify-icon[icon="logos:google-gmail"]    { font-size: 10px; }
  .icn iconify-icon[icon="logos:google-calendar"] { font-size: 14px; }
  .body { flex: 1; min-width: 0; }
  .row1 { display: flex; align-items: center; gap: 6px; }
  .title { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .title.b { font-weight: 600; }
  .time { font-size: 11px; color: #64748B; white-space: nowrap; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #388FEF; }
  .row2 { display: flex; align-items: center; gap: 3px; margin-top: 1px; }
  .src { font-size: 11px; color: #64748B; font-weight: 500; }
  .src.b { color: #0F172A; }
  .tag { font-size: 10px; font-weight: 500; padding: 1px 6px; border-radius: 10px; margin-left: 3px; }
  .tag.review { background: #FFFBEB; color: #92400E; font-weight: 600; }
  .tag.merged { background: #F5F3FF; color: #8B5CF6; }
  .tag.urgent { background: #FDF0F2; color: #E8899A; font-weight: 600; }
  .group { padding: 6px 14px 4px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #64748B; }
</style>
</head>
<body>
<div class="wrap">
  <div class="group">Today</div>
  <div class="item unread selected">
    <div class="icn"><iconify-icon icon="logos:github-icon"></iconify-icon></div>
    <div class="body">
      <div class="row1"><span class="title b">feat: Add OAuth2 PKCE flow for Linear integration #142</span><span class="dot"></span><span class="time">12m</span></div>
      <div class="row2"><span class="src b">universal-inbox/api</span><span class="tag review">review</span></div>
    </div>
  </div>
  <div class="item unread">
    <div class="icn"><iconify-icon icon="logos:linear-icon"></iconify-icon></div>
    <div class="body">
      <div class="row1"><span class="title b">Implement notification grouping by source</span><span class="dot"></span><span class="time">34m</span></div>
      <div class="row2"><span class="src b">UI-2847</span><span class="tag urgent">urgent</span></div>
    </div>
  </div>
  <div class="item">
    <div class="icn"><iconify-icon icon="logos:slack-icon"></iconify-icon></div>
    <div class="body">
      <div class="row1"><span class="title">@marc mentioned you in #engineering</span><span class="time">1h</span></div>
      <div class="row2"><span class="src">#engineering</span></div>
    </div>
  </div>
  <div class="item">
    <div class="icn"><iconify-icon icon="logos:github-icon"></iconify-icon></div>
    <div class="body">
      <div class="row1"><span class="title">fix: Stabilize browser tests with shared Playwright #130</span><span class="time">2h</span></div>
      <div class="row2"><span class="src">universal-inbox/api</span><span class="tag merged">merged</span></div>
    </div>
  </div>
</div>
</body>
</html>
