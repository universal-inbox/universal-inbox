fail_fast: true
repos:
  - repo: local
    hooks:
      - id: fmt
        name: Format Rust code
        description: Format files with cargo fmt
        entry: just format
        language: system
        files: \.rs$
        pass_filenames: false
        args: []
        stages: [pre-commit]
        priority: 0

  - repo: local
    hooks:
      - id: todo
        name: Check TODO in the code
        language: system
        pass_filenames: false
        entry: bash -c 'rg TODO && false || true'
        stages: [pre-commit]
        priority: 10

  - repo: local
    hooks:
      - id: hadolint
        name: Lint Dockerfile
        language: system
        entry: just lint-dockerfile
        pass_filenames: false
        files: Dockerfile$
        stages: [pre-commit]
        priority: 10
        
  - repo: local
    hooks:
      - id: clippy
        name: Check Rust code
        language: system
        pass_filenames: false
        entry: just check
        files: \.rs$
        stages: [pre-commit]
        priority: 10

  - repo: local
    hooks:
      - id: cargo-machete
        name: Detect unused Rust dependencies
        language: system
        pass_filenames: false
        entry: just check-unused-dependencies
        stages: [pre-commit]
        priority: 10

  - repo: local
    hooks:
      - id: test
        name: Test Rust code
        language: system
        pass_filenames: false
        entry: just test
        files: \.rs$
        stages: [pre-commit]
        priority: 20

  # Lives in the root project, not api/: prek runs same-depth projects (api/, web/)
  # concurrently, and `just web build-ci` would race web's `build-assets` on web/public.
  # The root project only runs after every nested project has finished.
  - repo: local
    hooks:
      - id: test-browser
        name: Test the web application with the browser
        language: system
        pass_filenames: false
        entry: just api test-browser
        files: ^api/.*\.rs$
        stages: [pre-commit]
        priority: 30
