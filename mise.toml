min_version = "2026.11.0"

[settings]
experimental = true
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[env]
SQLX_OFFLINE = "true"
RUST_MIN_STACK = "104857600"
RUST_BACKTRACE = "full"
PLAYWRIGHT_DRIVER_CACHE_DIR = "{{ get_env(name='PLAYWRIGHT_DRIVER_CACHE_DIR', default=get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache') ~ '/playwright-rs/drivers') }}"
VERSION = "{{ get_env(name='VERSION', default='dev') }}"
API_PORT = "8000"
DX_SERVE_PORT = "8080"
TARGET_CC = "cc"
COREPACK_ENABLE_AUTO_PIN = "0"
_.file = ".env"
DATABASE_URL = "postgres://postgres:password@127.0.0.1:{{ env.PGPORT }}/universal-inbox"
REDIS_PORT = "{{ env.REDIS_URL | split(pat=':') | last }}"
CADDY_CONFIG = "{{ config_root }}/dev/Caddyfile"

[daemons_settings]
namespace = "universal-inbox"

[daemon_groups]
default = ["postgresql", "redis"]

[daemons.postgresql]
preset = "postgres"
version = "17"
init = "bash dev/postgres-tune.sh"

[daemons.redis]
preset = "redis"
version = "8"

[daemons.ui-api]
run = "exec just api run-api"
depends = ["postgresql", "redis"]

[daemons.ui-workers]
run = "exec just api run-workers"
depends = ["postgresql", "redis"]

[daemons.ui-web]
run = "exec just web run false"

[daemons.build-tailwind]
run = "exec just web run-tailwind"

[daemons.bundle-js]
run = "exec just web run-bundle-js"

[daemons.stripe-listen]
run = "exec just api stripe-listen"
retry = 5

[daemons.caddy]
run = "exec caddy run --config=$CADDY_CONFIG"
retry = 5

[tools]
rust = { version = "1.98", components = "rust-analyzer,llvm-tools,clippy,rustfmt", targets = "wasm32-unknown-unknown", profile = "minimal" }
node = "22"
just = "latest"
watchexec = "latest"
taplo = "latest"
fzf = "latest"
jq = "latest"
prek = "latest"
sccache = "latest"
hadolint = "latest"
pinact = "latest"
caddy = "latest"
docker-compose = "latest"
"github:steveyegge/beads" = "latest"
"conda:binaryen" = "latest"
"conda:brotli-bin" = "latest"
"aqua:cargo-bins/cargo-binstall" = "latest"
cargo-deny = "latest"
cargo-nextest = "latest"
"aqua:bnjbvr/cargo-machete" = "latest"
"cargo:cargo-audit" = "latest"
"cargo:cargo-outdated" = "latest"
"cargo:cargo-chef" = "0.1.78"
"cargo:sqlx-cli" = "0.9.0"
"cargo:trunk" = "latest"
"cargo:wasm-bindgen-cli" = "0.2.126"
"cargo:dioxus-cli" = "0.7.10"
"cargo:mdbook-admonish" = "latest"
"github:rust-lang/mdBook" = "0.4.52"
"cargo:mdbook-linkcheck" = "latest"
"aqua:taiki-e/cargo-llvm-cov" = "0.6.16"
stripe = "latest"
pitchfork = "latest"

# Playwright version must match the playwright-rs crate (1.64.0 = Chromium 1248)
[tools."npm:playwright"]
version = "1.64.0"
postinstall = "playwright install chromium"

[tools."conda:lld"]
version = "latest"
os = ["macos"]
