[advisories]
ignore = [
  "RUSTSEC-2023-0071",  # rsa: only verifies signatures with public keys; no fixed release (keep in sync with deny.toml)
  "RUSTSEC-2026-0387",  # crypto-bigint 0.5: only verifies signatures with public keys via openidconnect; no fixed 0.5 release (keep in sync with deny.toml)
  "RUSTSEC-2026-0594",  # cookie 0.16 pinned by actix-web 4.19; only affects processes that fork() and this server never forks (keep in sync with deny.toml)
  "RUSTSEC-2026-0542",  # humantime unmaintained, no replacement upgrade available (keep in sync with deny.toml)
  "RUSTSEC-2026-0543",  # chrono unmaintained, no replacement upgrade available (keep in sync with deny.toml)
  "RUSTSEC-2026-0555",  # chrono-tz unmaintained, follows chrono (keep in sync with deny.toml)
]
